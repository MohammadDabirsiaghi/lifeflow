<div id="link-builder-ProjectId"

    <input type="hidden" 
           id="ProjectId" 
           name="ProjectId" 
           class="picker-value" 
           value="">

    

    <div class="row flex-nowrap g-2">
        <div class="link-control col" style="display: block;">
            <div class="input-group">
                <!-- اینپوت نمایشی (عنوان آیتم انتخاب‌شده) -->

                        id="ProjectIdTitle" 
                        name="ProjectIdTitle" 
                       class="form-control resettable product-picker-input bg-white text-muted picker-display" 
                       value="" 
                       readonly 
                       placeholder="انتخاب کنید...">

                <!-- دکمه باز کردن پاپ‌آپ انتخاب -->
                <div class="input-group-append">
                    <button type="button" 
                            class="btn btn-secondary btn-picker-open" 
                            onclick="entityPickerOpen('ProjectId');">
                        <span>…</span>
                    </button>
                </div>

                <!-- دکمه حذف/لغو لینک -->
                <div class="input-group-append">
                    <button type="button" 
                            class="btn btn-secondary btn-icon btn-to-danger btn-reset btn-picker-clear " 
                            onclick="entityPickerClear('ProjectId');">
                        <span>
                            <i class="fa fa-unlink"></i>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
