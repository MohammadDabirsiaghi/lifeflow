<div id="link-builder-ParentId" 
     class="link-builder edit-control entity-picker-control" 
     data-field-id="ParentId" 
     data-picker-url="/accounts/list-modal.html">

    <!-- اینپوت مخفی اصلی برای ارسال به سرور -->
    <input type="hidden" 
           id="ParentId" 
           name="ParentId" 
           class="picker-value" 
           value="">

    

    <div class="row flex-nowrap g-2">
        <div class="link-control col" style="display: block;">
            <div class="input-group">
                <!-- اینپوت نمایشی (عنوان آیتم انتخاب‌شده) -->
                <input type="text" 
                        id="ParentIdTitle" 
                        name="ParentIdTitle" 
                       class="form-control resettable product-picker-input bg-white text-muted picker-display" 
                       value="" 
                       readonly 
                       placeholder="انتخاب کنید...">

                <!-- دکمه باز کردن پاپ‌آپ انتخاب -->
                <div class="input-group-append">
                    <button type="button" 
                            class="btn btn-secondary btn-picker-open" 
                            onclick="entityPickerOpen('ParentId');">
                        <span>…</span>
                    </button>
                </div>

                <!-- دکمه حذف/لغو لینک -->
                <div class="input-group-append">
                    <button type="button" 
                            class="btn btn-secondary btn-icon btn-to-danger btn-reset btn-picker-clear " 
                            onclick="entityPickerClear('ParentId');">
                        <span>
                            <i class="fa fa-unlink"></i>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
